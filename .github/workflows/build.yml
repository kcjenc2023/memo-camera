name: APK 만들기
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor 프로젝트 만들기
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp ../index.html www/index.html
          npx cap init "지안평 현장조사" com.kcjenc.memocam --web-dir www
          npx cap add android
      - name: 폴더 저장 플러그인 추가
        run: |
          cd app/android/app/src/main
          D=java/com/kcjenc/memocam
          cat > $D/MediaSaver.java <<'JAVA'
          package com.kcjenc.memocam;

          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import org.json.JSONObject;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "MediaSaver")
          public class MediaSaver extends Plugin {
            @PluginMethod
            public void save(PluginCall call) {
              try {
                String folder = call.getString("folder", "현장사진");
                String name = call.getString("name");
                String mime = call.getString("mime", "image/jpeg");
                String data = call.getString("data");
                boolean replace = Boolean.TRUE.equals(call.getBoolean("replace", false));
                byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                boolean img = mime.startsWith("image/");
                String rel = (img ? Environment.DIRECTORY_PICTURES : Environment.DIRECTORY_DOCUMENTS) + "/" + folder;
                Uri coll = img ? MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                               : MediaStore.Files.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                ContentResolver cr = getContext().getContentResolver();
                Cursor c = cr.query(coll, new String[]{MediaStore.MediaColumns._ID},
                    MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + "=?",
                    new String[]{name, rel + "/"}, null);
                if (c != null) {
                  boolean found = c.moveToFirst();
                  long id = found ? c.getLong(0) : -1;
                  c.close();
                  if (found) {
                    if (!replace) { JSObject r = new JSObject(); r.put("ok", true); r.put("existed", true); call.resolve(r); return; }
                    cr.delete(ContentUris.withAppendedId(coll, id), null, null);
                  }
                }
                ContentValues v = new ContentValues();
                v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                v.put(MediaStore.MediaColumns.RELATIVE_PATH, rel);
                v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                Uri u = cr.insert(coll, v);
                if (u == null) { call.reject("insert failed"); return; }
                OutputStream o = cr.openOutputStream(u);
                o.write(bytes); o.close();
                ContentValues done = new ContentValues();
                done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                cr.update(u, done, null, null);
                JSObject r = new JSObject(); r.put("ok", true); call.resolve(r);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }

            private static byte[] enc(android.graphics.Bitmap b, int q) {
              java.io.ByteArrayOutputStream s = new java.io.ByteArrayOutputStream();
              b.compress(android.graphics.Bitmap.CompressFormat.JPEG, q, s);
              return s.toByteArray();
            }

            private static android.graphics.Bitmap fit(android.graphics.Bitmap b, int L) {
              int m = Math.max(b.getWidth(), b.getHeight());
              if (L <= 0 || m <= L) return b;
              float k = (float) L / m;
              return android.graphics.Bitmap.createScaledBitmap(b, Math.max(1, Math.round(b.getWidth() * k)), Math.max(1, Math.round(b.getHeight() * k)), true);
            }

            @PluginMethod
            public void process(PluginCall call) {
              try {
                long t0 = System.currentTimeMillis();
                String folder = call.getString("folder", "현장사진");
                String name = call.getString("name");
                String data = call.getString("data");
                double ratio = call.getDouble("ratio", 0.0);
          double zoom = call.getDouble("zoom", 1.0);
                int lng = call.getInt("long", 0);
                int q = call.getInt("q", 90);
                int thL = call.getInt("thumb", 360);
                int medL = call.getInt("med", 1600);
                JSArray lines = call.getArray("lines");
                String rel = Environment.DIRECTORY_PICTURES + "/" + folder;
                Uri coll = MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                ContentResolver cr = getContext().getContentResolver();
                Cursor c = cr.query(coll, new String[]{MediaStore.MediaColumns._ID},
                    MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + "=?",
                    new String[]{name, rel + "/"}, null);
                if (c != null) {
                  boolean found = c.moveToFirst();
                  c.close();
                  if (found) { JSObject r = new JSObject(); r.put("ok", true); r.put("existed", true); call.resolve(r); return; }
                }
                byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                BitmapFactory.Options bo = new BitmapFactory.Options();
                bo.inJustDecodeBounds = true;
                BitmapFactory.decodeByteArray(bytes, 0, bytes.length, bo);
                int deg = 0;
                try {
                  android.media.ExifInterface ex = new android.media.ExifInterface(new java.io.ByteArrayInputStream(bytes));
                  int ori = ex.getAttributeInt(android.media.ExifInterface.TAG_ORIENTATION, 1);
                  if (ori == 6) deg = 90; else if (ori == 3) deg = 180; else if (ori == 8) deg = 270;
                } catch (Exception e) { }
                int sample = 1;
                int big = Math.max(bo.outWidth, bo.outHeight);
                if (lng > 0) { double zf = zoom > 1.01 ? zoom : 1.0; while (big / (sample * 2.0) >= lng * zf) sample *= 2; }
                BitmapFactory.Options o2 = new BitmapFactory.Options();
                o2.inSampleSize = sample;
                Bitmap bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.length, o2);
                bytes = null;
                if (bmp == null) { call.reject("decode failed"); return; }
                if (deg != 0) {
                  Matrix mr = new Matrix();
                  mr.postRotate(deg);
                  Bitmap rot = Bitmap.createBitmap(bmp, 0, 0, bmp.getWidth(), bmp.getHeight(), mr, true);
                  if (rot != bmp) bmp.recycle();
                  bmp = rot;
                }
                int sw = bmp.getWidth(), sh = bmp.getHeight(), sx = 0, sy = 0;
          if (zoom > 1.01) {
            int zw = (int) Math.round(sw / zoom), zh = (int) Math.round(sh / zoom);
            sx = (sw - zw) / 2; sy = (sh - zh) / 2; sw = zw; sh = zh;
          }
                if (ratio > 0) {
                  double rr = sw > sh ? 1.0 / ratio : ratio;
                  double cur = (double) sw / sh;
                  if (cur > rr + 0.01) { int nw = (int) Math.round(sh * rr); sx += (int) Math.round((sw - nw) / 2.0); sw = nw; }
                  else if (cur < rr - 0.01) { int nh = (int) Math.round(sw / rr); sy += (int) Math.round((sh - nh) / 2.0); sh = nh; }
                }
                float k = 1f;
                if (lng > 0 && Math.max(sw, sh) > lng) k = (float) lng / Math.max(sw, sh);
                Bitmap out;
                if (k < 1f) {
                  Matrix ms = new Matrix();
                  ms.postScale(k, k);
                  out = Bitmap.createBitmap(bmp, sx, sy, sw, sh, ms, true);
                } else if (sx != 0 || sy != 0 || sw != bmp.getWidth() || sh != bmp.getHeight()) {
                  out = Bitmap.createBitmap(bmp, sx, sy, sw, sh);
                } else {
                  out = bmp;
                }
                if (out != bmp) bmp.recycle();
                if (!out.isMutable()) {
                  Bitmap mu = out.copy(Bitmap.Config.ARGB_8888, true);
                  out.recycle();
                  out = mu;
                }
                long t1 = System.currentTimeMillis();
                if (lines != null && lines.length() > 0) {
                  Canvas cv = new Canvas(out);
                  int cw = out.getWidth(), ch = out.getHeight();
                  int base = Math.min(cw, ch);
                  int bigFs = Math.round(base * 0.052f), smFs = Math.round(base * 0.032f);
                  int px = Math.round(base * 0.055f);
                  int maxW = cw - px * 2;
                  float y = ch - Math.round(base * 0.03f);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  p.setColor(0xFFFF9F1A);
                  p.setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD));
                  for (int i = lines.length() - 1; i >= 0; i--) {
                    JSONObject ln = lines.getJSONObject(i);
                    int fs = ln.optBoolean("big", false) ? bigFs : smFs;
                    String t = ln.getString("t");
                    p.setTextSize(fs);
                    float tw = p.measureText(t);
                    if (tw > maxW) { fs = Math.max(8, (int) Math.floor(fs * (float) maxW / tw)); p.setTextSize(fs); }
                    p.setShadowLayer(Math.max(1f, fs * 0.12f), fs * 0.04f, fs * 0.04f, 0x99000000);
                    cv.drawText(t, px, y, p);
                    if (i > 0) {
                      int nf = lines.getJSONObject(i - 1).optBoolean("big", false) ? bigFs : smFs;
                      y -= Math.round(nf * 0.95f + fs * 0.25f);
                    }
                  }
                }
                long t2 = System.currentTimeMillis();
                ContentValues v = new ContentValues();
                v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                v.put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg");
                v.put(MediaStore.MediaColumns.RELATIVE_PATH, rel);
                v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                Uri u = cr.insert(coll, v);
                if (u == null) { call.reject("insert failed"); return; }
                OutputStream os = cr.openOutputStream(u);
                out.compress(Bitmap.CompressFormat.JPEG, q, os);
                os.close();
                ContentValues done = new ContentValues();
                done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                cr.update(u, done, null, null);
                long t3 = System.currentTimeMillis();
                JSObject res = new JSObject();
                res.put("ok", true);
                res.put("thumb", Base64.encodeToString(enc(fit(out, thL), 70), Base64.NO_WRAP));
                res.put("med", Base64.encodeToString(enc(fit(out, medL), 85), Base64.NO_WRAP));
                res.put("w", out.getWidth());
                res.put("h", out.getHeight());
                res.put("t1", t1 - t0);
                res.put("t2", t2 - t1);
                res.put("t3", t3 - t2);
                call.resolve(res);
              } catch (Throwable e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.kcjenc.memocam;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(MediaSaver.class);
              super.onCreate(savedInstanceState);
              getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
            }
          }
          JAVA
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' AndroidManifest.xml
          cat AndroidManifest.xml
      - name: 앱 아이콘 만들기
        run: |
          R=app/android/app/src/main/res
          mkdir -p $R/drawable $R/values $R/mipmap-anydpi-v26
          cat > $R/values/ic_memo_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="ic_memo_bg">#0F2A44</color>
          </resources>
          XML
          cat > $R/drawable/ic_memo_fg.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFFFFF" android:pathData="M42,36 H54 L57,42 H39 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M36,42 H72 A6,6 0 0 1 78,48 V68 A6,6 0 0 1 72,74 H36 A6,6 0 0 1 30,68 V48 A6,6 0 0 1 36,42 Z"/>
            <path android:fillColor="#0F2A44" android:pathData="M46,58 A11,11 0 1 0 68,58 A11,11 0 1 0 46,58 Z"/>
            <path android:fillColor="#FF9F1A" android:pathData="M50,58 A7,7 0 1 0 64,58 A7,7 0 1 0 50,58 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M55,55 A2,2 0 1 0 59,55 A2,2 0 1 0 55,55 Z"/>
            <path android:fillColor="#FF9F1A" android:pathData="M34,60 H42 V63 H34 Z"/>
            <path android:fillColor="#FF9F1A" android:pathData="M34,66 H44 V70 H34 Z"/>
          </vector>
          XML
          for N in ic_launcher ic_launcher_round; do
          cat > $R/mipmap-anydpi-v26/$N.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_memo_bg"/>
            <foreground android:drawable="@drawable/ic_memo_fg"/>
          </adaptive-icon>
          XML
          done
      - name: 고정 서명키 설치 (업데이트할 때 덮어 설치되게 함)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - name: APK 빌드
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../memo-camera.apk
      - name: 내려받기 링크 만들기 (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" memo-camera.apk --title "지안평 현장조사 APK ${{ github.run_number }}" --notes "폰에서 memo-camera.apk 를 눌러 설치하세요"
