name: APK 만들기
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor 프로젝트 만들기
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp ../index.html www/index.html
          npx cap init "지안평 현장조사" com.kcjenc.memocam --web-dir www
          npx cap add android
      - name: 폴더 저장 플러그인 추가
        run: |
          cd app/android/app/src/main
          D=java/com/kcjenc/memocam
          cat > $D/MediaSaver.java <<'JAVA'
          package com.kcjenc.memocam;

          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import org.json.JSONObject;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "MediaSaver")
          public class MediaSaver extends Plugin {
            @PluginMethod
            public void save(PluginCall call) {
              try {
                String folder = call.getString("folder", "현장사진");
                String name = call.getString("name");
                String mime = call.getString("mime", "image/jpeg");
                String data = call.getString("data");
                boolean replace = Boolean.TRUE.equals(call.getBoolean("replace", false));
                byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                boolean img = mime.startsWith("image/");
                String rel = (img ? Environment.DIRECTORY_PICTURES : Environment.DIRECTORY_DOCUMENTS) + "/" + folder;
                Uri coll = img ? MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                               : MediaStore.Files.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                ContentResolver cr = getContext().getContentResolver();
                Cursor c = cr.query(coll, new String[]{MediaStore.MediaColumns._ID},
                    MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + "=?",
                    new String[]{name, rel + "/"}, null);
                if (c != null) {
                  boolean found = c.moveToFirst();
                  long id = found ? c.getLong(0) : -1;
                  c.close();
                  if (found) {
                    if (!replace) { JSObject r = new JSObject(); r.put("ok", true); r.put("existed", true); call.resolve(r); return; }
                    cr.delete(ContentUris.withAppendedId(coll, id), null, null);
                  }
                }
                ContentValues v = new ContentValues();
                v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                v.put(MediaStore.MediaColumns.RELATIVE_PATH, rel);
                v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                Uri u = cr.insert(coll, v);
                if (u == null) { call.reject("insert failed"); return; }
                OutputStream o = cr.openOutputStream(u);
                o.write(bytes); o.close();
                ContentValues done = new ContentValues();
                done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                cr.update(u, done, null, null);
                JSObject r = new JSObject(); r.put("ok", true); call.resolve(r);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }

            private static byte[] enc(android.graphics.Bitmap b, int q) {
              java.io.ByteArrayOutputStream s = new java.io.ByteArrayOutputStream();
              b.compress(android.graphics.Bitmap.CompressFormat.JPEG, q, s);
              return s.toByteArray();
            }

            private static android.graphics.Bitmap fit(android.graphics.Bitmap b, int L) {
              int m = Math.max(b.getWidth(), b.getHeight());
              if (L <= 0 || m <= L) return b;
              float k = (float) L / m;
              return android.graphics.Bitmap.createScaledBitmap(b, Math.max(1, Math.round(b.getWidth() * k)), Math.max(1, Math.round(b.getHeight() * k)), true);
            }

            @PluginMethod
            public void process(PluginCall call) {
              try {
                long t0 = System.currentTimeMillis();
                String folder = call.getString("folder", "현장사진");
                String name = call.getString("name");
                String data = call.getString("data");
                String shotId = call.getString("shotId", "");
                double ratio = call.getDouble("ratio", 0.0);
          double zoom = call.getDouble("zoom", 1.0);
                int lng = call.getInt("long", 0);
                int q = call.getInt("q", 90);
                int thL = call.getInt("thumb", 360);
                int medL = call.getInt("med", 1600);
                JSArray lines = call.getArray("lines");
                String rel = Environment.DIRECTORY_PICTURES + "/" + folder;
                Uri coll = MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                ContentResolver cr = getContext().getContentResolver();
                Cursor c = cr.query(coll, new String[]{MediaStore.MediaColumns._ID},
                    MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + "=?",
                    new String[]{name, rel + "/"}, null);
                if (c != null) {
                  boolean found = c.moveToFirst();
                  c.close();
                  if (found) { JSObject r = new JSObject(); r.put("ok", true); r.put("existed", true); call.resolve(r); return; }
                }
                byte[] bytes;
                if (shotId != null && !shotId.isEmpty()) {
                  java.io.File sf = CamPreview.shotFile(shotId);
                  if (sf == null) { call.reject("shot missing"); return; }
                  java.io.FileInputStream fin = new java.io.FileInputStream(sf);
                  java.io.ByteArrayOutputStream bos = new java.io.ByteArrayOutputStream();
                  byte[] buf = new byte[65536];
                  int rd;
                  while ((rd = fin.read(buf)) > 0) bos.write(buf, 0, rd);
                  fin.close();
                  bytes = bos.toByteArray();
                } else {
                  bytes = Base64.decode(data, Base64.DEFAULT);
                }
                BitmapFactory.Options bo = new BitmapFactory.Options();
                bo.inJustDecodeBounds = true;
                BitmapFactory.decodeByteArray(bytes, 0, bytes.length, bo);
                int deg = 0;
                try {
                  android.media.ExifInterface ex = new android.media.ExifInterface(new java.io.ByteArrayInputStream(bytes));
                  int ori = ex.getAttributeInt(android.media.ExifInterface.TAG_ORIENTATION, 1);
                  if (ori == 6) deg = 90; else if (ori == 3) deg = 180; else if (ori == 8) deg = 270;
                } catch (Exception e) { }
                int sample = 1;
                int big = Math.max(bo.outWidth, bo.outHeight);
                if (lng > 0) { double zf = zoom > 1.01 ? zoom : 1.0; while (big / (sample * 2.0) >= lng * zf) sample *= 2; }
                BitmapFactory.Options o2 = new BitmapFactory.Options();
                o2.inSampleSize = sample;
                Bitmap bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.length, o2);
                bytes = null;
                if (bmp == null) { call.reject("decode failed"); return; }
                if (deg != 0) {
                  Matrix mr = new Matrix();
                  mr.postRotate(deg);
                  Bitmap rot = Bitmap.createBitmap(bmp, 0, 0, bmp.getWidth(), bmp.getHeight(), mr, true);
                  if (rot != bmp) bmp.recycle();
                  bmp = rot;
                }
                int sw = bmp.getWidth(), sh = bmp.getHeight(), sx = 0, sy = 0;
          if (zoom > 1.01) {
            int zw = (int) Math.round(sw / zoom), zh = (int) Math.round(sh / zoom);
            sx = (sw - zw) / 2; sy = (sh - zh) / 2; sw = zw; sh = zh;
          }
                if (ratio > 0) {
                  double rr = sw > sh ? 1.0 / ratio : ratio;
                  double cur = (double) sw / sh;
                  if (cur > rr + 0.01) { int nw = (int) Math.round(sh * rr); sx += (int) Math.round((sw - nw) / 2.0); sw = nw; }
                  else if (cur < rr - 0.01) { int nh = (int) Math.round(sw / rr); sy += (int) Math.round((sh - nh) / 2.0); sh = nh; }
                }
                float k = 1f;
                if (lng > 0 && Math.max(sw, sh) > lng) k = (float) lng / Math.max(sw, sh);
                Bitmap out;
                if (k < 1f) {
                  Matrix ms = new Matrix();
                  ms.postScale(k, k);
                  out = Bitmap.createBitmap(bmp, sx, sy, sw, sh, ms, true);
                } else if (sx != 0 || sy != 0 || sw != bmp.getWidth() || sh != bmp.getHeight()) {
                  out = Bitmap.createBitmap(bmp, sx, sy, sw, sh);
                } else {
                  out = bmp;
                }
                if (out != bmp) bmp.recycle();
                if (!out.isMutable()) {
                  Bitmap mu = out.copy(Bitmap.Config.ARGB_8888, true);
                  out.recycle();
                  out = mu;
                }
                long t1 = System.currentTimeMillis();
                if (lines != null && lines.length() > 0) {
                  Canvas cv = new Canvas(out);
                  int cw = out.getWidth(), ch = out.getHeight();
                  int base = Math.min(cw, ch);
                  int bigFs = Math.round(base * 0.052f), smFs = Math.round(base * 0.032f);
                  int px = Math.round(base * 0.055f);
                  int maxW = cw - px * 2;
                  float y = ch - Math.round(base * 0.03f);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  p.setColor(0xFFFF9F1A);
                  p.setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD));
                  for (int i = lines.length() - 1; i >= 0; i--) {
                    JSONObject ln = lines.getJSONObject(i);
                    int fs = ln.optBoolean("big", false) ? bigFs : smFs;
                    String t = ln.getString("t");
                    p.setTextSize(fs);
                    float tw = p.measureText(t);
                    if (tw > maxW) { fs = Math.max(8, (int) Math.floor(fs * (float) maxW / tw)); p.setTextSize(fs); }
                    p.setShadowLayer(Math.max(1f, fs * 0.12f), fs * 0.04f, fs * 0.04f, 0x99000000);
                    cv.drawText(t, px, y, p);
                    if (i > 0) {
                      int nf = lines.getJSONObject(i - 1).optBoolean("big", false) ? bigFs : smFs;
                      y -= Math.round(nf * 0.95f + fs * 0.25f);
                    }
                  }
                }
                long t2 = System.currentTimeMillis();
                ContentValues v = new ContentValues();
                v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                v.put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg");
                v.put(MediaStore.MediaColumns.RELATIVE_PATH, rel);
                v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                Uri u = cr.insert(coll, v);
                if (u == null) { call.reject("insert failed"); return; }
                OutputStream os = cr.openOutputStream(u);
                out.compress(Bitmap.CompressFormat.JPEG, q, os);
                os.close();
                ContentValues done = new ContentValues();
                done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                cr.update(u, done, null, null);
                long t3 = System.currentTimeMillis();
                if (shotId != null && !shotId.isEmpty()) CamPreview.dropShot(shotId);
                JSObject res = new JSObject();
                res.put("ok", true);
                res.put("thumb", Base64.encodeToString(enc(fit(out, thL), 70), Base64.NO_WRAP));
                res.put("med", Base64.encodeToString(enc(fit(out, medL), 85), Base64.NO_WRAP));
                res.put("w", out.getWidth());
                res.put("h", out.getHeight());
                res.put("t1", t1 - t0);
                res.put("t2", t2 - t1);
                res.put("t3", t3 - t2);
                call.resolve(res);
              } catch (Throwable e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
          }
          JAVA
          cat > $D/CamPreview.java <<'JAVA'
          package com.kcjenc.memocam;

          import android.Manifest;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.util.Range;
          import android.util.Size;
          import android.util.SizeF;
          import android.view.ViewGroup;
          import android.webkit.WebView;
          import androidx.camera.camera2.interop.Camera2CameraInfo;
          import androidx.camera.core.Camera;
          import androidx.camera.core.CameraFilter;
          import androidx.camera.core.CameraInfo;
          import androidx.camera.core.CameraSelector;
          import androidx.camera.core.ImageCapture;
          import androidx.camera.core.ImageCaptureException;
          import androidx.camera.core.Preview;
          import androidx.camera.core.ZoomState;
          import androidx.camera.core.resolutionselector.AspectRatioStrategy;
          import androidx.camera.core.resolutionselector.ResolutionSelector;
          import androidx.camera.core.resolutionselector.ResolutionStrategy;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.view.PreviewView;
          import androidx.core.content.ContextCompat;
          import androidx.lifecycle.LifecycleOwner;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import com.google.common.util.concurrent.ListenableFuture;
          import java.io.File;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Map;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name = "CamPreview", permissions = { @Permission(strings = { Manifest.permission.CAMERA }, alias = "camera") })
          public class CamPreview extends Plugin {
            static final Map<String, File> SHOTS = new ConcurrentHashMap<>();
            static File shotFile(String id) { return SHOTS.get(id); }
            static void dropShot(String id) { File f = SHOTS.remove(id); if (f != null) f.delete(); }

            private static class Lens { String id; double equiv; double ratio; }
            private static class Plan { String id; double zoom; }
            private interface ShotCb { void done(File f, Exception e); }

            private PreviewView pv;
            private ProcessCameraProvider provider;
            private Camera camera;
            private ImageCapture capture;
            private final ExecutorService exec = Executors.newSingleThreadExecutor();
            private final List<Lens> lenses = new ArrayList<>();
            private Lens ref;
            private double refZmin = 1.0;
            private String curId = null;
            private int longSide = 4000;
            private int rx, ry, rw, rh;

            private static String msg(Throwable e) { return String.valueOf(e.getMessage()); }

            @PluginMethod
            public void start(PluginCall call) {
              if (getPermissionState("camera") != PermissionState.GRANTED) {
                requestPermissionForAlias("camera", call, "permCb");
                return;
              }
              doStart(call);
            }

            @PermissionCallback
            private void permCb(PluginCall call) {
              if (getPermissionState("camera") == PermissionState.GRANTED) doStart(call);
              else call.reject("camera permission denied");
            }

            private void doStart(final PluginCall call) {
              rx = call.getInt("x", 0);
              ry = call.getInt("y", 0);
              rw = call.getInt("w", 1080);
              rh = call.getInt("h", 1440);
              longSide = call.getInt("long", 4000);
              getActivity().runOnUiThread(() -> {
                try {
                  scanLenses();
                  WebView web = getBridge().getWebView();
                  ViewGroup parent = (ViewGroup) web.getParent();
                  if (pv == null) {
                    pv = new PreviewView(getContext());
                    pv.setImplementationMode(PreviewView.ImplementationMode.COMPATIBLE);
                    pv.setScaleType(PreviewView.ScaleType.FILL_CENTER);
                    parent.setBackgroundColor(Color.BLACK);
                    ViewGroup.MarginLayoutParams lp = new ViewGroup.MarginLayoutParams(rw, rh);
                    lp.leftMargin = rx;
                    lp.topMargin = ry;
                    parent.addView(pv, 0, lp);
                    web.setBackgroundColor(Color.TRANSPARENT);
                  } else {
                    applyRect();
                  }
                  final ListenableFuture<ProcessCameraProvider> fut = ProcessCameraProvider.getInstance(getContext());
                  fut.addListener(() -> {
                    try {
                      provider = fut.get();
                      try {
                        bind(ref.id, 1.0);
                      } catch (Exception e1) {
                        bind(null, 1.0);
                      }
                      JSObject r = new JSObject();
                      r.put("ok", true);
                      r.put("info", lensInfo());
                      r.put("minT", minTarget());
                      r.put("maxT", 10);
                      call.resolve(r);
                    } catch (Exception e) {
                      call.reject(msg(e));
                    }
                  }, ContextCompat.getMainExecutor(getContext()));
                } catch (Exception e) {
                  call.reject(msg(e));
                }
              });
            }

            private void applyRect() {
              if (pv == null) return;
              ViewGroup.MarginLayoutParams lp = (ViewGroup.MarginLayoutParams) pv.getLayoutParams();
              lp.width = rw;
              lp.height = rh;
              lp.leftMargin = rx;
              lp.topMargin = ry;
              pv.setLayoutParams(lp);
            }

            @PluginMethod
            public void rect(PluginCall call) {
              rx = call.getInt("x", rx);
              ry = call.getInt("y", ry);
              rw = call.getInt("w", rw);
              rh = call.getInt("h", rh);
              getActivity().runOnUiThread(() -> {
                try { applyRect(); call.resolve(); } catch (Exception e) { call.reject(msg(e)); }
              });
            }

            private void scanLenses() throws Exception {
              lenses.clear();
              ref = null;
              CameraManager cm = (CameraManager) getContext().getSystemService(Context.CAMERA_SERVICE);
              for (String id : cm.getCameraIdList()) {
                CameraCharacteristics c = cm.getCameraCharacteristics(id);
                Integer face = c.get(CameraCharacteristics.LENS_FACING);
                if (face == null || face != CameraCharacteristics.LENS_FACING_BACK) continue;
                float[] fl = c.get(CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS);
                SizeF ss = c.get(CameraCharacteristics.SENSOR_INFO_PHYSICAL_SIZE);
                if (fl == null || fl.length == 0 || ss == null) continue;
                Lens l = new Lens();
                l.id = id;
                l.equiv = fl[0] * 43.27 / Math.hypot(ss.getWidth(), ss.getHeight());
                lenses.add(l);
              }
              double bd = 1e9;
              for (Lens l : lenses) {
                double d = Math.abs(l.equiv - 24.0);
                if (d < bd) { bd = d; ref = l; }
              }
              if (ref == null) throw new Exception("no back camera");
              for (Lens l : lenses) l.ratio = l.equiv / ref.equiv;
              refZmin = 1.0;
              try {
                Range<Float> zr = cm.getCameraCharacteristics(ref.id).get(CameraCharacteristics.CONTROL_ZOOM_RATIO_RANGE);
                if (zr != null) refZmin = zr.getLower();
              } catch (Throwable t) { }
            }

            private String lensInfo() {
              StringBuilder sb = new StringBuilder();
              for (Lens l : lenses) {
                if (sb.length() > 0) sb.append(", ");
                sb.append("camera ").append(l.id).append(": ").append(String.format(java.util.Locale.US, "%.2f", l.ratio)).append("x");
                if (l == ref) sb.append("(기준)");
              }
              return sb.toString();
            }

            private double minTarget() {
              double m = 1.0;
              for (Lens l : lenses) if (l.ratio < m) m = l.ratio;
              if (refZmin < m) m = refZmin;
              return m < 0.55 ? 0.5 : Math.round(m * 10) / 10.0;
            }

            private CameraSelector selectorFor(final String id) {
              if (id == null) return CameraSelector.DEFAULT_BACK_CAMERA;
              return new CameraSelector.Builder().addCameraFilter(new CameraFilter() {
                @Override
                public List<CameraInfo> filter(List<CameraInfo> infos) {
                  List<CameraInfo> out = new ArrayList<>();
                  for (CameraInfo ci : infos) {
                    if (id.equals(Camera2CameraInfo.from(ci).getCameraId())) out.add(ci);
                  }
                  return out;
                }
              }).build();
            }

            private void bind(String id, double zoom) throws Exception {
              provider.unbindAll();
              Preview preview = new Preview.Builder()
                  .setResolutionSelector(new ResolutionSelector.Builder()
                      .setAspectRatioStrategy(AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY).build())
                  .build();
              preview.setSurfaceProvider(pv.getSurfaceProvider());
              ResolutionSelector.Builder rsb = new ResolutionSelector.Builder()
                  .setAspectRatioStrategy(AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY);
              if (longSide > 0) {
                rsb.setResolutionStrategy(new ResolutionStrategy(new Size(longSide, longSide * 3 / 4),
                    ResolutionStrategy.FALLBACK_RULE_CLOSEST_HIGHER_THEN_LOWER));
              } else {
                rsb.setResolutionStrategy(ResolutionStrategy.HIGHEST_AVAILABLE_STRATEGY);
              }
              capture = new ImageCapture.Builder()
                  .setCaptureMode(ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY)
                  .setFlashMode(ImageCapture.FLASH_MODE_OFF)
                  .setResolutionSelector(rsb.build())
                  .build();
              camera = provider.bindToLifecycle((LifecycleOwner) getActivity(), selectorFor(id), preview, capture);
              curId = id;
              setZoomRatioSafe(zoom);
            }

            private void setZoomRatioSafe(double z) {
              if (camera == null) return;
              float v = (float) z;
              ZoomState zs = camera.getCameraInfo().getZoomState().getValue();
              if (zs != null) v = Math.max(zs.getMinZoomRatio(), Math.min(zs.getMaxZoomRatio(), v));
              camera.getCameraControl().setZoomRatio(v);
            }

            private Plan plan(double t) {
              Plan p = new Plan();
              if (Math.abs(Math.log(t)) < 0.08 && ref != null) { p.id = ref.id; p.zoom = 1.0; return p; }
              Lens best = null;
              double bd = Math.log(1.3);
              for (Lens l : lenses) {
                double d = Math.abs(Math.log(l.ratio / t));
                if (d < bd) { bd = d; best = l; }
              }
              if (best != null) { p.id = best.id; p.zoom = Math.max(1.0, t / best.ratio); return p; }
              Lens base = null;
              for (Lens l : lenses) {
                if (l.ratio <= t * 1.1 && (base == null || l.ratio > base.ratio)) base = l;
              }
              if (base == null) {
                if (ref != null && refZmin <= t + 0.01) { p.id = ref.id; p.zoom = t; return p; }
                return null;
              }
              p.id = base.id;
              p.zoom = t / base.ratio;
              return p;
            }

            @PluginMethod
            public void zoom(final PluginCall call) {
              final double t = call.getDouble("t", 1.0);
              getActivity().runOnUiThread(() -> {
                try {
                  Plan p = plan(t);
                  JSObject r = new JSObject();
                  if (p == null || provider == null) { r.put("ok", false); call.resolve(r); return; }
                  if (!p.id.equals(curId)) {
                    try { bind(p.id, p.zoom); } catch (Exception e) { bind(ref.id, Math.max(1.0, t)); }
                  } else {
                    setZoomRatioSafe(p.zoom);
                  }
                  r.put("ok", true);
                  r.put("lens", curId);
                  call.resolve(r);
                } catch (Exception e) {
                  call.reject(msg(e));
                }
              });
            }

            private void takeOne(final ShotCb cb) {
              try {
                final File f = File.createTempFile("shot", ".jpg", getContext().getCacheDir());
                getActivity().runOnUiThread(() -> {
                  try {
                    capture.takePicture(new ImageCapture.OutputFileOptions.Builder(f).build(), exec,
                        new ImageCapture.OnImageSavedCallback() {
                          @Override
                          public void onImageSaved(ImageCapture.OutputFileResults r) { cb.done(f, null); }
                          @Override
                          public void onError(ImageCaptureException ex) { f.delete(); cb.done(null, ex); }
                        });
                  } catch (Exception ex) {
                    f.delete();
                    cb.done(null, ex);
                  }
                });
              } catch (Exception e) {
                cb.done(null, e);
              }
            }

            private void burst(final int n, final List<File> got, final long t0, final PluginCall call) {
              takeOne((f, e) -> {
                if (e != null) {
                  for (File g : got) g.delete();
                  call.reject(msg(e));
                  return;
                }
                got.add(f);
                if (got.size() < n) { burst(n, got, t0, call); return; }
                File best = got.get(0);
                if (n > 1) {
                  double bs = -1;
                  for (File g : got) {
                    double s = sharp(g);
                    if (s > bs) { bs = s; best = g; }
                  }
                  for (File g : got) if (g != best) g.delete();
                }
                String id = UUID.randomUUID().toString();
                SHOTS.put(id, best);
                JSObject r = new JSObject();
                r.put("ok", true);
                r.put("id", id);
                r.put("ms", System.currentTimeMillis() - t0);
                call.resolve(r);
              });
            }

            @PluginMethod
            public void shoot(PluginCall call) {
              int n = Math.max(1, Math.min(3, call.getInt("burst", 1)));
              File[] old = getContext().getCacheDir().listFiles();
              if (old != null) {
                for (File o : old) {
                  if (o.getName().startsWith("shot") && System.currentTimeMillis() - o.lastModified() > 600000L && !SHOTS.containsValue(o)) o.delete();
                }
              }
              burst(n, new ArrayList<File>(), System.currentTimeMillis(), call);
            }

            private double sharp(File f) {
              try {
                BitmapFactory.Options o = new BitmapFactory.Options();
                o.inJustDecodeBounds = true;
                BitmapFactory.decodeFile(f.getPath(), o);
                int ss = 1;
                while (Math.max(o.outWidth, o.outHeight) / (ss * 2) >= 600) ss *= 2;
                BitmapFactory.Options o2 = new BitmapFactory.Options();
                o2.inSampleSize = ss;
                Bitmap b = BitmapFactory.decodeFile(f.getPath(), o2);
                if (b == null) return 0;
                int w = b.getWidth(), h = b.getHeight();
                int[] px = new int[w * h];
                b.getPixels(px, 0, w, 0, 0, w, h);
                b.recycle();
                float[] g = new float[w * h];
                for (int i = 0; i < g.length; i++) {
                  int p = px[i];
                  g[i] = 0.3f * ((p >> 16) & 255) + 0.59f * ((p >> 8) & 255) + 0.11f * (p & 255);
                }
                double sum = 0, sq = 0;
                int cnt = 0;
                for (int y = 1; y < h - 1; y++) {
                  for (int x = 1; x < w - 1; x++) {
                    int i = y * w + x;
                    double l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w];
                    sum += l;
                    sq += l * l;
                    cnt++;
                  }
                }
                return cnt == 0 ? 0 : sq / cnt - (sum / cnt) * (sum / cnt);
              } catch (Throwable t) {
                return 0;
              }
            }

            @PluginMethod
            public void stop(PluginCall call) {
              getActivity().runOnUiThread(() -> {
                try {
                  if (provider != null) provider.unbindAll();
                  if (pv != null) {
                    ViewGroup parent = (ViewGroup) pv.getParent();
                    if (parent != null) parent.removeView(pv);
                    pv = null;
                  }
                  camera = null;
                  capture = null;
                  curId = null;
                  call.resolve();
                } catch (Exception e) {
                  call.reject(msg(e));
                }
              });
            }
          }

